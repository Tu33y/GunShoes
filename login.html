<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Gun Shoes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div id="particles-js"></div>

    <main>
        <section id="login-page" class="login-page">
             <div class="page-header">
                <h1>Account</h1>
                <p>Login or create an account to manage your orders.</p>
            </div>
            <div class="login-container">
                <form class="login-form">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <div class="input-field">
                             <svg height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="m22 6.251-9.986 6.964a.5.5 0 0 1-.522.001l-10.002-6.964a.5.5 0 0 1 .51-.882h20a.5.5 0 0 1 .5 1.002v-.121zm-20 1.521v10.478a.5.5 0 0 0 .5.5h20a.5.5 0 0 0 .5-.5v-10.478l-10.493 7.302a.5.5 0 0 1-.521-.001z" fill="currentColor"></path></svg>
                            <input type="email" id="email" name="email" class="input" placeholder="name@email.com" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-field">
                            <svg height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="m12.002 14.518c-1.381 0-2.5-1.119-2.5-2.5s1.119-2.5 2.5-2.5 2.5 1.119 2.5 2.5-1.119 2.5-2.5 2.5zm6.498-2.5c0 3.59-2.91 6.5-6.5 6.5s-6.5-2.91-6.5-6.5 2.91-6.5 6.5-6.5 6.5 2.91 6.5 6.5zm-2.001 0c0-2.485-2.015-4.5-4.5-4.5s-4.5 2.015-4.5 4.5 2.015 4.5 4.5 4.5 4.5-2.015 4.5-4.5z" fill="currentColor"></path></svg>
                            <input type="password" id="password" name="password" class="input" placeholder="Password" required>
                        </div>
                    </div>
                    <div class="form-options">
                        <div>
                            <input type="checkbox" id="remember-me">
                            <label for="remember-me">Remember me</label>
                        </div>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>
                    <button type="submit" class="submit-btn">Sign In</button>
                    <p class="signup-link">Not a member? <a href="#">Create an account</a></p>
                </form>

                <div class="newsletter-container">
                    <h2 class="step-title">Join our Newsletter</h2>
                    <form id="newsletter-form" class="newsletter-form">
                        <div class="form-group">
                            <label for="newsletter-email">Email Address</label>
                            <input type="email" id="newsletter-email" name="email" required placeholder="Enter your email">
                        </div>
                        <button type="submit" class="btn">Subscribe</button>
                    </form>
                </div>
            </div>
        </section>
        <div id="gradual-blur"></div>
    </main>

    <footer>
        <p>&copy; 2024 GUN SHOES. All rights reserved.</p>
    </footer>

        <a href="cart.html" class="dock-item" title="Carrello">

        </a>
        <a href="account.html" class="dock-item" title="Account">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-user"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </a>
        <label class="switch">
          <input id="theme-switcher" type="checkbox">
          <span class="slider">
              <div class="star star_1"></div>
              <div class="star star_2"></div>
              <div class="star star_3"></div>
              <svg class="cloud" fill="#FFFFFF" height="100px" viewBox="0 0 100 100" version="1.1" width="100px" xmlns="http://www.w3.org/2000/svg">
                <path d="M 67.421875 22.988281 C 67.421875 22.988281 67.421875 22.988281 67.421875 22.988281 C 65.050781 16.355469 58.261719 11.992188 50.5 11.992188 C 42.738281 11.992188 35.949219 16.355469 33.578125 22.988281 C 33.578125 22.988281 33.578125 22.988281 33.578125 22.988281 C 23.480469 24.347656 15.992188 32.859375 15.992188 43.492188 C 15.992188 54.757812 24.933594 63.667969 36.222656 63.667969 L 65.710938 63.667969 C 74.53125 63.667969 81.992188 56.242188 81.992188 47.460938 C 81.992188 38.679688 74.53125 31.320312 65.710938 31.320312 C 65.710938 31.320312 65.710938 31.320312 65.710938 31.320312 C 66.570312 28.53125 67.421875 25.683594 67.421875 22.988281 Z M 67.421875 22.988281 " />

          </span>
        </label>
    </nav>

    <script src="script.js"></script>
    <script src="cart-logic.js"></script>
