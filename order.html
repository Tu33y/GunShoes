<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order - Gun Shoes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div id="particles-js"></div>

    <main>
        <section id="order-page" class="order-page">
            <div class="page-header">
                <h1>Secure Checkout</h1>
                <p>Complete your purchase of the future of footwear.</p>
            </div>

            <div class="checkout-container">
                <div class="progress-bar">
                    <div class="progress-step active" data-step="1">
                        <span>Summary</span>
                        <div class="progress-dot"></div>
                    </div>
                    <div class="progress-step" data-step="2">
                        <span>Data</span>
                        <div class="progress-dot"></div>
                    </div>
                    <div class="progress-step" data-step="3">
                        <span>Shipping</span>
                        <div class="progress-dot"></div>
                    </div>
                    <div class="progress-step" data-step="4">
                        <span>Payment</span>
                        <div class="progress-dot"></div>
                    </div>
                </div>

                <form id="checkout-form" class="checkout-form">
                    <!-- Step 1: Summary -->
                    <div class="form-step active" id="step-1">
                        <h2 class="step-title">Order Summary</h2>
                        <div id="cart-summary-container" class="cart-summary-container">
                            <!-- Summary content will be loaded here -->
                        </div>
                        <div class="form-navigation">
                            <button type="button" class="btn next-step">Next</button>
                        </div>
                    </div>

                    <!-- Step 2: User Data -->
                    <div class="form-step" id="step-2">
                        <h2 class="step-title">Your Data</h2>
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-navigation">
                            <button type="button" class="btn prev-step">Back</button>
                            <button type="button" class="btn next-step">Next</button>
                        </div>
                    </div>

                    <!-- Step 3: Shipping Information -->
                    <div class="form-step" id="step-3">
                        <h2 class="step-title">Shipping Information</h2>
                        <div class="form-group">
                            <label for="address">Address</label>
                            <input type="text" id="address" name="address" required>
                        </div>
                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city" name="city" required>
                        </div>
                        <div class="form-group">
                            <label for="zip">ZIP Code</label>
                            <input type="text" id="zip" name="zip" required>
                        </div>
                        <div class="form-group">
                            <label for="country">Country</label>
                            <input type="text" id="country" name="country" required>
                        </div>
                        <div class="form-navigation">
                            <button type="button" class="btn prev-step">Back</button>
                            <button type="button" class="btn next-step">Next</button>
                        </div>
                    </div>

                    <!-- Step 4: Payment Details -->
                    <div class="form-step" id="step-4">
                        <h2 class="step-title">Payment Details</h2>
                        <div class="payment-options">
                            <button type="button" class="payment-btn" title="Pay with PayPal">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M3.201 3.442c.38.002.736.174.982.493l.433.585a.5.5 0 0 1-.397.81H1.5c-.39 0-.62-.27-.406-.639l.298-.543c.27-.492.768-.696 1.223-.702l.586-.006Z M22.5 12c0-5.01-3.72-9.103-8.5-9.103H1.5c-.52 0-.91.43-.91.91v.19c0 .02.02.02.02.02h.19c.47 0 .85.38.85.85v13.26c0 .47-.38.85-.85.85H.59a.91.91 0 0 0-.91.91v.19c0 .02.02.02.02.02h12.58c4.78 0 8.5-4.093 8.5-9.103Zm-16.89 4.31h2.78l.58 2.61h2.47l-2.6-10.37H6.43l-2.6 10.37h2.52l.82-3.43Zm3.43-1.63-.5-2.26c-.08-.34-.14-.7-.2-1.04h-.02c-.06.34-.12.7-.2 1.04l-.5 2.26h1.42Zm5.05 1.63h2.11c2.04 0 3.33-1.04 3.33-3.13c0-1.53-.8-2.52-2.18-2.82c.8-.3 1.2-.95 1.2-1.83c0-1.32-.9-2.2-2.38-2.2h-1.98v10zm2.52-6.07c.93 0 1.4.49 1.4 1.3c0 .86-.53 1.38-1.55 1.38h-.7v-2.68h.85Zm.14-3.56c.7 0 1.1.4 1.1 1.07c0 .7-.4 1.15-1.2 1.15h-.6v-2.22h.7Z"/></svg>
                            </button>
                            <button type="button" class="payment-btn" title="Pay with Google Pay">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M10.58 10.152v3.696h5.212c-.217 1.424-1.63 3.696-5.212 3.696c-3.153 0-5.718-2.608-5.718-5.826c0-3.218 2.565-5.826 5.718-5.826c1.782 0 2.87.76 3.544 1.391l2.587-2.478C15.217 3.39 13.13 2 10.58 2C5.826 2 2 5.912 2 10.674c0 4.76 3.826 8.674 8.58 8.674c5.022 0 8.348-3.456 8.348-8.456c0-.543-.065-1.022-.152-1.522h-8.2Z"/></svg>
                            </button>
                            <button type="button" class="payment-btn" title="Pay with Apple Pay">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M10.595 2.073c-.783.002-1.735.336-2.56.884c-.833.553-1.633 1.48-2.148 2.64c-1.14 2.566-.46 5.867 1.033 8.39c.49.83 1.114 1.63 1.88 2.27c.753.633 1.446.99 2.22.98c.72 0 1.29-.313 2.04-.883c.753-.57 1.467-1.48 2.027-2.64c.98-2.073.96-4.32.02-6.146a7.63 7.63 0 0 0-2.31-2.56c-.68-.43-1.44-.64-2.225-.635m-.12 1.63c.48-.003.92.14 1.3.37c.78.46 1.36 1.493 1.48 2.926c-1.12.013-2.32.4-3.113 1.153c-.793.753-1.227 1.76-1.18 2.813c.013.373.1.706.26 1.013c.16.306.346.52.56.666c.213.147.426.22.64.22c.24 0 .493-.08.76-.24c.267-.16.546-.373.84-.64c.587-.533 1.014-1.226 1.28-2.08c.08-.253.12-.506.12-.76c0-.027-.003-.09-.01-.22h-1.547c-1.107 0-1.66-.56-1.66-1.68c0-1.12.553-1.68 1.66-1.68h3.333c.027 0 .04.004.04.013c.053 2.187-.694 4.027-2.24 5.52c-.613.6-1.346.934-2.2.997c-.853.063-1.62-.2-2.3-.786c-.68-.587-1.2-1.347-1.56-2.28c-1.28-2.227-1.74-4.887-.82-7.187c.46-.986 1.153-1.76 2.08-2.313c.63-.377 1.3-.59 1.95-.583Z"/></svg>
                            </button>
                        </div>

                        <div class="separator">
                            <span class="line"></span>
                            <p>Or pay with card</p>
                            <span class="line"></span>
                        </div>

                        <div class="credit-card-form">
                            <div class="card-row">
                                <input type="text" name="cardName" id="cardName" placeholder="Full Name" class="card-input full-width" required>
                                <div class="card-logo">
                                    <svg class="mastercard-logo" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 48 48">
                                        <path fill="#ff9800" d="M32 10A14 14 0 1 0 32 38A14 14 0 1 0 32 10Z"></path>
                                        <path fill="#d50000" d="M16 10A14 14 0 1 0 16 38A14 14 0 1 0 16 10Z"></path>
                                        <path fill="#ff3d00" d="M18,24c0,4.755,2.376,8.95,6,11.48c3.624-2.53,6-6.725,6-11.48s-2.376-8.95-6-11.48 C20.376,15.05,18,19.245,18,24z"></path>
                                    </svg>
                                </div>
                            </div>
                            <div class="card-row">
                                <input type="text" name="cardNumber" id="cardNumber" placeholder="0000 0000 0000 0000" class="card-input" required>
                            </div>
                            <div class="card-row-split">
                                <input type="text" name="expiryDate" id="expiryDate" placeholder="MM/YY" class="card-input" required>
                                <input type="text" name="cvv" id="cvv" placeholder="CVV" class="card-input" required>
                            </div>
                        </div>
                        <div class="form-navigation">
                            <button type="button" class="btn prev-step">Back</button>
                            <button type="button" class="btn next-step">Pay Now</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
        <div id="gradual-blur"></div>
    </main>

    <footer>
        <p>&copy; 2024 GUN SHOES. All rights reserved.</p>
    </footer>

    <nav id="dock-container">
        <a href="index.html" class="dock-item" title="Home">

        </a>
        <a href="products.html" class="dock-item" title="Galleria Prodotti">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </a>
        <a href="cart.html" class="dock-item" title="Carrello">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>

        <a href="account.html" class="dock-item" title="Account">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-user"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>

        <label class="switch">
          <input id="theme-switcher" type="checkbox">
          <span class="slider">
              <div class="star star_1"></div>
              <div class="star star_2"></div>
              <div class="star star_3"></div>

        </label>
    </nav>

    <script src="script.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
