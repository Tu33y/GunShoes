<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Gun Shoes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div id="particles-js"></div>

    <main>
        <section id="checkout-page" class="checkout-page">
            <div class="page-header">
                <h1>Checkout</h1>
                <p>Complete your order by providing the details below.</p>
            </div>

            <div class="checkout-container">
                <form id="checkout-form" class="checkout-form">
                    <div class="form-section">
                        <h2>Shipping Information</h2>
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="address">Address</label>
                            <input type="text" id="address" name="address" required>
                        </div>
                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city" name="city" required>
                        </div>
                        <div class="form-group">
                            <label for="zip">ZIP Code</label>
                            <input type="text" id="zip" name="zip" required>
                        </div>
                    </div>

                    <div class="form-section">
                        <h2>Payment Details</h2>
                        <div class="credit-card-form">
                            <div class="card-row">
                                <input type="text" name="cardName" id="cardName" placeholder="Full Name" class="card-input full-width" required>
                                <div class="card-logo">
                                    <svg class="mastercard-logo" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 48 48">
                                        <path fill="#ff9800" d="M32 10A14 14 0 1 0 32 38A14 14 0 1 0 32 10Z"></path>
                                        <path fill="#d50000" d="M16 10A14 14 0 1 0 16 38A14 14 0 1 0 16 10Z"></path>
                                        <path fill="#ff3d00" d="M18,24c0,4.755,2.376,8.95,6,11.48c3.624-2.53,6-6.725,6-11.48s-2.376-8.95-6-11.48 C20.376,15.05,18,19.245,18,24z"></path>
                                    </svg>
                                </div>
                            </div>
                            <div class="card-row">
                                <input type="text" name="cardNumber" id="cardNumber" placeholder="0000 0000 0000 0000" class="card-input" required>
                            </div>
                            <div class="card-row-split">
                                <input type="text" name="expiryDate" id="expiryDate" placeholder="MM/YY" class="card-input" required>
                                <input type="text" name="cvv" id="cvv" placeholder="CVV" class="card-input" required>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn">Place Order</button>
                </form>

                <div class="order-summary">
                    <h2>Order Summary</h2>
                    <div id="summary-items">
                        <!-- Summary items will be dynamically inserted here -->
                    </div>
                    <hr>
                    <div class="summary-row total">
                        <span>Total</span>
                        <span id="summary-total">$0.00</span>
                    </div>
                </div>
            </div>
        </section>
        <div id="gradual-blur"></div>
    </main>

    <footer>
        <p>&copy; 2024 GUN SHOES. All rights reserved.</p>
    </footer>

    <nav id="dock-container">
        <a href="index.html" class="dock-item" title="Home">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </a>

        </a>
        <a href="technology.html" class="dock-item" title="Technology">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>

        <a href="cart.html" class="dock-item" title="Cart">

        </a>
        <a href="newsletter.html" class="dock-item" title="Newsletter">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
